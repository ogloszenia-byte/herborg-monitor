# GitHub WYLACZA harmonogram w publicznym repo po 60 dniach bez aktywnosci.
# Raz w miesiacu robimy commit z data, zeby monitor.yml nie zasnal.
name: podtrzymanie

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .podtrzymanie
          git config user.name "herborg-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .podtrzymanie
          git commit -m "podtrzymanie harmonogramu" && git push
